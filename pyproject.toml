[project]
name = "sfsim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vysakh Ramakrishnan", email = "vysakhramkrishnan7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "groq>=1.5.0",
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
]

[project.scripts]
sfsim = "sfsim:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
